{% extends 'base.html' %}
{% block header %}
  <h1>{% block title %}Allocations{% endblock %}</h1>
{% endblock %}

{% block content %}
  <table class="table table-striped table-bordered table-hover">
    <thead class="text-center">
      <tr>
        <th>Date</th>
        <th>Item</th>
        <th>Amount</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      {% for allocation in allocations %}
        <tr>
          {% for data in allocation %}<td>{{ data }}</td>{% endfor %}
        </tr>
      {% else %}
        <tr class="text-center">
          <td colspan="4">No allocations available</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
